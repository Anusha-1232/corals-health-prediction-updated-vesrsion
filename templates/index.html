<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Health Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    background:#000;
}

/* 🌊 BACKGROUND IMAGE */
.bg-image{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    filter:brightness(0.8) saturate(1.2);
    animation:zoomBg 20s ease-in-out infinite alternate;
}

/* Background animation */
@keyframes zoomBg{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

/* 🌑 DARK OVERLAY */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0, 20, 40, 0.55);
    z-index:1;
}

/* Floating bubbles */
.bubble{
    position:absolute;
    bottom:-100px;
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    animation:float 12s linear infinite;
    z-index:2;
    backdrop-filter:blur(5px);
}

.bubble:nth-child(1){
    left:10%;
    width:60px;
    height:60px;
    animation-duration:10s;
}

.bubble:nth-child(2){
    left:30%;
    animation-duration:14s;
}

.bubble:nth-child(3){
    left:50%;
    width:70px;
    height:70px;
    animation-duration:16s;
}

.bubble:nth-child(4){
    left:70%;
    animation-duration:12s;
}

.bubble:nth-child(5){
    left:90%;
    width:50px;
    height:50px;
    animation-duration:18s;
}

@keyframes float{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

/* Glass Container */
.container{
    width:420px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    animation:fadeIn 1.5s ease;
    position:relative;
    z-index:3;
}

@keyframes fadeIn{
    from{
        transform:translateY(40px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:32px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    font-size:14px;
    opacity:0.85;
    line-height:1.5;
}

input,
select{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:16px;
    transition:0.3s;
}

input:focus,
select:focus{
    background:rgba(255,255,255,0.3);
    transform:scale(1.02);
}

input::placeholder{
    color:#f1f1f1;
}

select option{
    color:black;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#00e5ff;
    color:#001f3f;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
    margin-top:10px;
    box-shadow:0 4px 20px rgba(0,229,255,0.4);
}

button:hover{
    transform:scale(1.05);
    background:white;
    box-shadow:0 6px 25px rgba(255,255,255,0.5);
}

/* Responsive */
@media(max-width:500px){

    .container{
        width:90%;
        padding:25px;
    }

    h1{
        font-size:26px;
    }
}

</style>
</head>

<body>

<!-- 🌊 Coral Background Image -->
<img class="bg-image"
src="https://images.unsplash.com/photo-1546026423-cc4642628d2b?q=80&w=1920&auto=format&fit=crop"
alt="coral reef background">

<!-- Floating Bubbles -->
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<!-- Main Glass Container -->
<div class="container">

    <h1>🌊 Coral Health AI</h1>

    <div class="subtitle">
        Predict future coral reef health using AI & environmental factors
    </div>

    <form action="/predict" method="POST">

        <input type="number"
               name="year"
               placeholder="Enter Year"
               required>

        <input type="number"
               step="0.01"
               name="richness"
               placeholder="Species Richness"
               required>

        <input type="number"
               step="0.01"
               name="temp"
               placeholder="Water Temperature °C"
               required>

        <select name="region" required>
            <option value="">Select Region</option>
            <option value="Upper Keys">Upper Keys</option>
            <option value="Middle Keys">Middle Keys</option>
            <option value="Lower Keys">Lower Keys</option>
        </select>

        <button type="submit">
            Predict Coral Health
        </button>

    </form>

</div>

</body>
</html>
